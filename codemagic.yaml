workflows:
  ios-capacitor:
    name: iOS Capacitor (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
      cocoapods: default
scripts:
      - name: Install deps
        script: |
          npm i -g pnpm
          pnpm install --no-frozen-lockfile
      - name: Build web (dist)
        script: pnpm run build
      - name: Capacitor sync iOS
        script: pnpm exec cap sync ios
      - name: Pod install
        script: |
          cd ios/App
          pod install
      - name: Build (no signing yet)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
        artifacts:
      - ios/App/build/**/*.app
android-capacitor:
    name: Android Capacitor (APK)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
    scripts:
      - name: Install deps
        script: |
          npm i -g pnpm
          pnpm install --no-frozen-lockfile
      - name: Build web
        script: pnpm run build
      - name: Capacitor sync android
        script: pnpm exec cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk      