workflows:
  ios-capacitor:
    name: iOS Capacitor (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install deps
        script: npm ci
      - name: Build web (dist)
        script: npm run build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Pod install
        script: |
          cd ios/App
          pod install
      - name: Build (no signing yet)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/**/*.app